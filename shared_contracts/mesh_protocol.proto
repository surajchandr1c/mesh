syntax = "proto3";

package qthorium.mesh;

message TaskRequest {
  string task_id = 1;
  string prompt = 2;
  int32 max_tokens = 3;
}

message TokenChunk {
  string task_id = 1;
  string token = 2;
  bool is_final = 3;
}

message HeartbeatPing {
  string node_id = 1;
  float cpu_utilization = 2;
  float ram_available_mb = 3;
  bool is_ready = 4;
}

message HeartbeatAck {
  bool received = 1;
}

service MeshNodeService {
  rpc ProcessTask(TaskRequest) returns (stream TokenChunk);
  rpc SendHeartbeat(HeartbeatPing) returns (HeartbeatAck);
}
